<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #343a40;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .wrap {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-control {
            background-color: #454d55;
            color: #fff;
            border-color: #6c757d;
            border-radius: 10px;
            font-size: 1rem;
            padding: 14px 16px;
            height: auto;
        }

        .form-control:focus {
            background-color: #454d55;
            color: #fff;
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.3);
        }

        .form-control::placeholder { color: #adb5bd; }

        .btn-danger {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 4px;
        }

        .gif-wrap {
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        .gif-wrap img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #6c757d;
        }

        /* Loading overlay */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(33, 37, 41, 0.92);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        #overlay.active { display: flex; }

        #overlay img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #dc3545;
        }

        #overlay p {
            color: #f8f9fa;
            font-size: 1rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>🐨 Pobierz wideo z TikToka</h1>
        <form method="POST" id="dl-form">
            <div class="form-group mb-3">
                <input type="text" id="url" name="url" class="form-control"
                       placeholder="https://www.tiktok.com/@..." autocomplete="off" required>
            </div>
            <button type="submit" class="btn btn-danger" id="dl-btn">⬇ Pobierz</button>
        </form>

        <div class="gif-wrap">
            <img src="https://gifdb.com/images/thumbnail/bear-hug-kiss-bubu-dudu-pdyvjfqgohc9pk18.gif" alt="Dudu i Bubu">
        </div>
    </div>

    <div id="overlay">
        <img src="https://gifdb.com/images/thumbnail/bear-hug-kiss-bubu-dudu-pdyvjfqgohc9pk18.gif" alt="Ładowanie...">
        <p>Dudu i Bubu pobierają&hellip; 🎀</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('dl-form').addEventListener('submit', function () {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('dl-btn').disabled = true;
        });
    </script>
</body>
</html>
